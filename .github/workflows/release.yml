name: Release DMG

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish Apple Silicon DMG
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Validate release tag and project version
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Unsupported release tag: ${GITHUB_REF_NAME}" >&2
            exit 1
          fi

          release_version="${GITHUB_REF_NAME#v}"
          project_version="$({
            xcodebuild \
              -project ThermalPulse.xcodeproj \
              -scheme ThermalPulse \
              -configuration Release \
              CODE_SIGNING_ALLOWED=NO \
              -showBuildSettings
          } | awk '/MARKETING_VERSION = / { print $3; exit }')"

          if [[ "${project_version}" != "${release_version}" ]]; then
            echo "Tag ${release_version} does not match MARKETING_VERSION ${project_version}" >&2
            exit 1
          fi

          echo "RELEASE_VERSION=${release_version}" >> "${GITHUB_ENV}"
          echo "DERIVED_DATA=${RUNNER_TEMP}/DerivedData" >> "${GITHUB_ENV}"
          echo "DMG_NAME=ThermalPulse-${GITHUB_REF_NAME}-macos-arm64.dmg" >> "${GITHUB_ENV}"

      - name: Run normal tests
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -quiet \
            -project ThermalPulse.xcodeproj \
            -scheme ThermalPulse \
            -configuration Debug \
            -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath "${DERIVED_DATA}" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES \
            test

      - name: Build release app
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -quiet \
            -project ThermalPulse.xcodeproj \
            -scheme ThermalPulse \
            -configuration Release \
            -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath "${DERIVED_DATA}" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES \
            build

      - name: Package and verify DMG
        shell: bash
        run: |
          set -euo pipefail

          app_path="${DERIVED_DATA}/Build/Products/Release/ThermalPulse.app"
          helper_path="${app_path}/Contents/Resources/ThermalPulseHelper"
          installer_path="${app_path}/Contents/Resources/Install Turbo Helper.command"
          manual_plist_path="${app_path}/Contents/Resources/io.github.iyuenan3.thermalpulse.helper.manual.plist"
          artifact_dir="${RUNNER_TEMP}/artifacts"
          staging_dir="${RUNNER_TEMP}/dmg-staging"
          mount_dir="${RUNNER_TEMP}/dmg-mount"
          dmg_path="${artifact_dir}/${DMG_NAME}"

          test -d "${app_path}"
          test -x "${helper_path}"
          test -x "${installer_path}"
          bash -n "${installer_path}"
          plutil -lint "${manual_plist_path}"

          bundle_version="$(plutil -extract CFBundleShortVersionString raw "${app_path}/Contents/Info.plist")"
          if [[ "${bundle_version}" != "${RELEASE_VERSION}" ]]; then
            echo "Built bundle version ${bundle_version} does not match ${RELEASE_VERSION}" >&2
            exit 1
          fi

          codesign --force --options runtime --sign - "${helper_path}"
          codesign --force --options runtime --sign - "${app_path}"
          codesign --verify --deep --strict --verbose=2 "${app_path}"

          app_cdhash="$(codesign -d --verbose=4 "${app_path}" 2>&1 | awk -F= '$1 == "CDHash" { print tolower($2); exit }')"
          helper_cdhash="$(codesign -d --verbose=4 "${helper_path}" 2>&1 | awk -F= '$1 == "CDHash" { print tolower($2); exit }')"
          test "${#app_cdhash}" -eq 40
          test "${#helper_cdhash}" -eq 40
          codesign --verify --strict \
            -R="identifier \"io.github.iyuenan3.thermalpulse\" and cdhash H\"${app_cdhash}\"" \
            "${app_path}"
          codesign --verify --strict \
            -R="identifier \"io.github.iyuenan3.thermalpulse.helper\" and cdhash H\"${helper_cdhash}\"" \
            "${helper_path}"

          mkdir -p "${artifact_dir}" "${staging_dir}" "${mount_dir}"
          ditto "${app_path}" "${staging_dir}/ThermalPulse.app"
          ln -s /Applications "${staging_dir}/Applications"

          hdiutil create \
            -volname "ThermalPulse" \
            -srcfolder "${staging_dir}" \
            -ov \
            -format UDZO \
            "${dmg_path}"
          hdiutil verify "${dmg_path}"

          hdiutil attach \
            "${dmg_path}" \
            -readonly \
            -nobrowse \
            -mountpoint "${mount_dir}"
          trap 'hdiutil detach "${mount_dir}" >/dev/null 2>&1 || true' EXIT

          test -d "${mount_dir}/ThermalPulse.app"
          test -L "${mount_dir}/Applications"
          codesign --verify --deep --strict --verbose=2 "${mount_dir}/ThermalPulse.app"
          mounted_version="$(plutil -extract CFBundleShortVersionString raw "${mount_dir}/ThermalPulse.app/Contents/Info.plist")"
          test "${mounted_version}" = "${RELEASE_VERSION}"

          hdiutil detach "${mount_dir}"
          trap - EXIT

          (
            cd "${artifact_dir}"
            shasum -a 256 "${DMG_NAME}" > "${DMG_NAME}.sha256"
          )

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          notes_path="${RUNNER_TEMP}/release-notes.md"
          printf '%s\n' \
            "# ThermalPulse ${GITHUB_REF_NAME}" \
            "" \
            "预发布测试版本，支持 macOS 26 及以上的 Apple 芯片 MacBook Pro。" \
            "" \
            "- 菜单栏显示 P 核、E 核温度和动态风扇转速。" \
            "- 展开面板显示电池温度、5 分钟温度曲线、系统热状态和全部风扇。" \
            "- 单风扇转速居中显示，双风扇转速上下显示。" \
            "- 新增协议 v8 管理员安装器，以固定 App 与受限 helper 的代码哈希。" \
            "" \
            "此公开 DMG 使用 ad hoc 签名且未公证。只读监控无需管理员权限。Turbo 需要把 App 拖入“应用程序”后，在 App 内打开管理员安装器；安装器不会在安装时启动 Turbo。协议 v8 的 root 安装、XPC 和真实 Turbo 尚待用户实机验收，CI 发布成功不代表 Turbo 已验收。" \
            > "${notes_path}"

          gh release create "${GITHUB_REF_NAME}" \
            "${RUNNER_TEMP}/artifacts/${DMG_NAME}" \
            "${RUNNER_TEMP}/artifacts/${DMG_NAME}.sha256" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "ThermalPulse ${GITHUB_REF_NAME}" \
            --notes-file "${notes_path}" \
            --prerelease \
            --verify-tag

      - name: Remove binary assets from older releases
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          gh release list \
            --repo "${GITHUB_REPOSITORY}" \
            --limit 100 \
            --json tagName \
            --jq '.[].tagName' \
            | while IFS= read -r release_tag; do
                [[ -n "${release_tag}" && "${release_tag}" != "${GITHUB_REF_NAME}" ]] || continue
                gh release view "${release_tag}" \
                  --repo "${GITHUB_REPOSITORY}" \
                  --json assets \
                  --jq '.assets[].name' \
                  | while IFS= read -r asset_name; do
                      if [[ "${asset_name}" =~ ^ThermalPulse-v[0-9]+\.[0-9]+\.[0-9]+-macos-arm64\.dmg(\.sha256)?$ ]]; then
                        gh release delete-asset "${release_tag}" "${asset_name}" \
                          --repo "${GITHUB_REPOSITORY}" \
                          --yes
                      fi
                    done
              done
